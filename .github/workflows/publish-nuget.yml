name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore CreateAgent.sln

      - name: Test
        run: dotnet test CreateAgent.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack CreateAgent.sln --configuration Release --no-restore --output artifacts/packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          version="$(dotnet msbuild src/CreateAgent/CreateAgent.csproj -nologo -getProperty:PackageVersion)"

          packages=(
            CreateAgent.Abstractions
            CreateAgent.Core
            CreateAgent.Runtime.Processes
            CreateAgent.Storage.FileSystem
            CreateAgent.Providers.ClaudeCode
            CreateAgent.Providers.Codex
            CreateAgent.Providers.OpenCode
            CreateAgent
            CreateAgent.Cli
          )

          for package in "${packages[@]}"; do
            dotnet nuget push "artifacts/packages/${package}.${version}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
